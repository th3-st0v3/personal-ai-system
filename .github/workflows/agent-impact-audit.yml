name: agent-impact-audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pasi-agent-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build commit scope and blast-radius report
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="origin/${BASE_REF}"
          {
            echo "# PASI Agent Impact Audit"
            echo
            echo "PR: #${{ github.event.pull_request.number }}"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Commits beyond base | $(git rev-list --count "${BASE}"..HEAD) |"
            echo "| Changed files | $(git diff --name-only "${BASE}"...HEAD | sed '/^$/d' | wc -l) |"
            echo "| Lines added | $(git diff --numstat "${BASE}"...HEAD | awk '{a += $1} END {print a+0}') |"
            echo "| Lines deleted | $(git diff --numstat "${BASE}"...HEAD | awk '{d += $2} END {print d+0}') |"
            echo
            echo "## Conventional-commit scopes"
            echo
            python - <<'PY'
          import re
          import subprocess
          from collections import Counter

          base = "origin/" + __import__("os").environ["BASE_REF"]
          subjects = subprocess.check_output(
              ["git", "log", "--format=%s", f"{base}..HEAD"], text=True
          ).splitlines()
          counts = Counter()
          unscoped = 0
          pattern = re.compile(r"^[a-z]+(?:\(([^)]+)\))?[!?:]")
          for subject in subjects:
              match = pattern.match(subject)
              if match and match.group(1):
                  counts[match.group(1)] += 1
              else:
                  unscoped += 1
          print("| Scope | Commit count |")
          print("| --- | ---: |")
          for scope, count in counts.most_common():
              print(f"| `{scope}` | {count} |")
          print(f"| `unscoped/other` | {unscoped} |")
          PY
            echo
            echo "## Directory footprint"
            echo
            git diff --name-only "${BASE}"...HEAD |
              awk -F/ 'NF > 1 {print $1 "/" $2} NF == 1 {print $1}' |
              sort | uniq -c | sort -nr |
              awk '{printf "- `%s`: %s files\n", $2, $1}'
            echo
            echo "## Largest file deltas"
            echo
            echo "```text"
            git diff --stat "${BASE}"...HEAD | tail -n 25
            echo "```"
            echo
            echo "This report is observational. It does not declare whether a large change is correct."
          } >> "${GITHUB_STEP_SUMMARY}"
