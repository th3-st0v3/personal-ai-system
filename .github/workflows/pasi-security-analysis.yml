name: PASI security analysis

on:
  # PR security runs only after the fast test workflow succeeds, preventing
  # CodeQL from occupying the sole WSL runner ahead of the primary gate.
  workflow_run:
    workflows: ["test"]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A single WSL runner services this workflow. Keep only the newest security run
# for each ref so obsolete queued scans cannot starve current verification.
concurrency:
  group: pasi-security-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # CodeQL needs the security-events permission to publish when the repository
  # has GitHub Code Security enabled. We deliberately keep upload disabled in
  # this private repository until that repository feature is available.
  security-events: write
  actions: read


jobs:
  codeql:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        language: [python, javascript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze without GitHub code-scanning upload
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: never
      - name: Archive CodeQL SARIF
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: ignore

  secret-scan:
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/scan_repository_secrets.py

  dependency-audit:
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt
