name: self-modification-boundary-audit

on:
  # Run after the fast validation gate so this observational audit never
  # competes with the primary PR test job.
  workflow_run:
    workflows: ["test"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pasi-self-modification-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Classify changed paths against PASI promotion policy
        env:
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref || 'main' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import os
          import subprocess
          from scripts.pasi_promote import classify_risk

          base = "origin/" + os.environ["BASE_REF"]
          paths = [
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"], text=True
              ).splitlines()
              if line.strip()
          ]
          risk = classify_risk(paths)
          high_risk = []
          for path in paths:
              normalized = path.replace("\\", "/").lstrip("/")
              if normalized.startswith((".github/workflows/", "automation/chromium/", "automation/legacy/", "automation/tampermonkey/")):
                  high_risk.append(path)
              elif normalized in {
                  "scripts/pasi_overnight_engine_v2.py",
                  "scripts/pasi_extended_runtime_entrypoint.py",
                  "scripts/start_pasi_168h.sh",
                  "scripts/start_pasi_overnight.sh",
                  "scripts/stop_pasi_overnight.sh",
                  "scripts/status_pasi_overnight.sh",
                  "scripts/pasi_promote.py",
                  "scripts/pasi_overnight_hardening.py",
                  "scripts/pasi_chat_guard.py",
                  "scripts/pasi_provider_router.py",
              }:
                  high_risk.append(path)

          print("# PASI Self-Modification Boundary Audit")
          print()
          print(f"Promotion policy risk class: **{risk}**")
          print()
          if high_risk:
              print("## High-risk paths touched")
              print()
              for path in high_risk:
                  print(f"- `{path}`")
              print()
              print("These paths remain subject to PASI's existing human-review/promotion boundaries.")
          else:
              print("No configured high-risk controller/runtime/workflow paths were touched.")
          print()
          print("This workflow is observational; the authoritative unattended patch boundary remains enforced by PASI itself.")
          PY
