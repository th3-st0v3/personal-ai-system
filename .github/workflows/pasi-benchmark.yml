name: PASI runtime contract benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: pasi-runtime-contract-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run runtime contract benchmark
        run: |
          python scripts/pasi_runtime_benchmark.py

      - name: Run benchmark regression tests
        run: |
          python -m pytest -q scripts/test_pasi_runtime_benchmark.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: pasi-runtime-contract-benchmark
          path: |
            .runtime/benchmark/runtime-contract.json
            .runtime/benchmark/runtime-contract.md
          if-no-files-found: error
