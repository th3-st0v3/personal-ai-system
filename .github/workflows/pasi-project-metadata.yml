name: PASI Project Metadata Sync

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to synchronize; leave empty to synchronize all PASI metadata issues"
        required: false
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: pasi-project-metadata
  cancel-in-progress: false

jobs:
  sync:
    # Issue-triggered runs are restricted to repository-owner changes so an
    # arbitrary public issue author cannot execute Project-write automation on
    # the self-hosted runner.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.actor == 'th3-st0v3' &&
           contains(github.event.issue.body, 'PASI_PROJECT_METADATA')) }}
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
      PASI_PROJECT_OWNER: ${{ vars.PASI_PROJECT_OWNER || 'th3-st0v3' }}
      PASI_PROJECT_NUMBER: ${{ vars.PASI_PROJECT_NUMBER }}
      PASI_PROJECT_TITLE: ${{ vars.PASI_PROJECT_TITLE }}
      PASI_PROJECT_RETRIES: "4"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Project configuration and token
        shell: bash
        run: |
          set -euo pipefail

          test -n "${GH_TOKEN}" || {
            echo "::error::Missing PASI_PROJECTS_TOKEN repository secret. It needs GitHub Project write access."
            exit 1
          }

          test -n "${PASI_PROJECT_NUMBER}" || {
            echo "::error::Missing PASI_PROJECT_NUMBER repository variable."
            echo "::error::Set PASI_PROJECT_NUMBER to the exact user-owned PASI Project number."
            exit 1
          }

          [[ "${PASI_PROJECT_NUMBER}" =~ ^[0-9]+$ ]] || {
            echo "::error::PASI_PROJECT_NUMBER must be an integer."
            exit 1
          }

          login="$(gh api user --jq '.login')"
          echo "Authenticated GitHub API principal: ${login}"

          gh api graphql -f query='
            query($login:String!, $number:Int!) {
              user(login:$login) {
                projectV2(number:$number) {
                  id
                  number
                  title
                }
              }
            }'             -f login="${PASI_PROJECT_OWNER}"             -F number="${PASI_PROJECT_NUMBER}"             --jq '.data.user.projectV2 // error("Project not found or not accessible")' > project.json

          project_title="$(python3 -c 'import json; print(json.load(open("project.json"))["title"])')"
          echo "Target Project: ${project_title} (#${PASI_PROJECT_NUMBER})"

          if [ -n "${PASI_PROJECT_TITLE:-}" ] && [ "${project_title}" != "${PASI_PROJECT_TITLE}" ]; then
            echo "::error::PASI_PROJECT_TITLE does not match the deterministic Project number."
            echo "::error::Expected: ${PASI_PROJECT_TITLE}"
            echo "::error::Actual:   ${project_title}"
            exit 1
          fi

      - name: Synchronize and verify metadata
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail

          if [ -n "${ISSUE_NUMBER}" ]; then
            python3 scripts/sync_pasi_project_metadata.py "${ISSUE_NUMBER}"
          else
            python3 scripts/sync_pasi_project_metadata.py --all
          fi
