name: PASI One-Off Project Scheduling

on:
  issues:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: pasi-one-off-project-scheduling
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      ${{ github.event.sender.login == 'th3-st0v3' &&
          contains(github.event.issue.body, '<!-- PASI_ONE_OFF_PROJECT_SYNC -->') }}
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
      PASI_PROJECT_OWNER: ${{ vars.PASI_PROJECT_OWNER || 'th3-st0v3' }}
      PASI_PROJECT_NUMBER: ${{ vars.PASI_PROJECT_NUMBER }}
      PASI_PROJECT_TITLE: ${{ vars.PASI_PROJECT_TITLE }}
      PASI_PROJECT_RETRIES: "4"
    steps:
      - name: Check out project synchronizer
        uses: actions/checkout@v7
        with:
          ref: pasi/project-metadata-automation-20260924
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          test -n "${PASI_PROJECT_NUMBER}"
          [[ "${PASI_PROJECT_NUMBER}" =~ ^[0-9]+$ ]]
          gh api graphql -f query='
            query($login:String!, $number:Int!) {
              user(login:$login) {
                projectV2(number:$number) {
                  id
                  number
                  title
                  viewerCanUpdate
                }
              }
            }' \
            -f login="${PASI_PROJECT_OWNER}" \
            -F number="${PASI_PROJECT_NUMBER}" \
            --jq '.data.user.projectV2 | select(.viewerCanUpdate == true) | .title' >/dev/null

      - name: Sync all roadmap items
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_pasi_project_metadata.py
          python3 scripts/sync_pasi_project_metadata.py --roadmap
