name: branch-hygiene

on:
  # Sweep every branch after a push so new and existing work is covered.
  push:
  pull_request:
    types: [opened, synchronize, closed, converted_to_ready_for_review]
  workflow_run:
    workflows: ["test"]
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  test:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run branch-hygiene unit tests
        run: python -m unittest -v scripts.test_cleanup_duplicate_branches

  reconcile:
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sweep safe duplicate and unnecessary branch refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/cleanup_duplicate_branches.py --json
      - name: Reconcile orphan branches and pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/reconcile_branch_prs.py --json
