name: test

on:
  push:
    branches: [main, beta-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run beta smoke test
        env:
          PYTHONPATH: src
        run: python scripts/smoke_test_beta.py
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Run orchestrator and computer-use tests
        run: python -m pytest -q automation/orchestrator automation/computer_use
      - name: Static type check
        run: npx --yes pyright@latest src scripts automation/orchestrator automation/computer_use
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@latest "**/*.md" "#node_modules" "#**/.venv/**" "#**/venv/**" "#**/env/**"
      - name: Validate web client syntax
        run: |
          set -e
          for file in web/*.js; do node --check "$file"; done
      - name: Validate automation JavaScript syntax
        run: |
          set -e
          for file in automation/tampermonkey/*.js; do node --check "$file"; done
      - name: Frontend contract smoke test
        env:
          PYTHONPATH: src
        run: python scripts/frontend_contract_test.py
      - name: Browser/API smoke test
        env:
          PYTHONPATH: src
        run: python scripts/ci_web_smoke.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: .runtime/ci
          if-no-files-found: ignore

  browser-use-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned browser-use dependency
        run: |
          python -m pip install -r requirements-browser.txt
          python -m pip install 'pytest>=8,<9'
      - name: Validate browser-use version and public imports
        run: |
          python - <<'PY'
          import importlib.metadata
          from browser_use import Agent, Browser

          version = importlib.metadata.version("browser-use")
          assert version == "0.13.10", version
          assert Agent is not None
          assert Browser is not None
          print(f"browser-use {version}: import compatibility OK")
          PY
      - name: Run browser integration contract tests
        run: python -m pytest -q automation/computer_use/test_browser_use.py
