name: test

on:
  push:
    branches: [main, beta-foundation, 'pasi/**']
  pull_request:
    branches: [main, 'pasi/**']
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  free-validation:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: pasi-free-validation-${{ github.workflow }}-${{ github.sha }}
      cancel-in-progress: false
    # Keep this validation path on the PASI WSL self-hosted runner.
    # GitHub-hosted runners consume private-repository Actions minutes;
    # self-hosted runners do not accrue GitHub Actions billable minutes.
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 30
    steps:
      - name: Assert free self-hosted execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "self-hosted"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"

          command -v gh >/dev/null 2>&1 || {
            echo "GitHub CLI is required to verify the selected runner labels." >&2
            exit 1
          }

          runner_name="${RUNNER_NAME:-}"
          repository="${GITHUB_REPOSITORY:-}"
          test -n "$runner_name"
          test -n "$repository"

          # The Actions runner context exposes name/OS/arch but not its label set.
          # Query GitHub's authoritative self-hosted-runner API for this exact runner.
          # We deliberately unset GITHUB_TOKEN/GH_TOKEN so the check uses the
          # runner user's pre-provisioned gh credential, which must have
          # repository administration read access. There is no hosted-runner fallback.
          labels="$(
            env -u GITHUB_TOKEN -u GH_TOKEN gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${repository}/actions/runners?per_page=100" \
              --jq '.runners[] | select(.name == env.RUNNER_NAME) | .labels[].name' \
              || true
          )"

          if [ -z "$labels" ]; then
            echo "Unable to read labels for selected runner: $runner_name" >&2
            echo "This check fails closed; free-validation will not continue." >&2
            exit 1
          fi

          printf '%s\n' "$labels" | sed 's/.*/\L&/' | sort -u > "${RUNNER_TEMP}/actual-runner-labels.txt"
          printf '%s\n' self-hosted linux x64 pasi-wsl | sort -u > "${RUNNER_TEMP}/required-runner-labels.txt"

          echo "Selected runner: $runner_name"
          echo "Required labels:"
          cat "${RUNNER_TEMP}/required-runner-labels.txt"
          echo "Observed labels:"
          cat "${RUNNER_TEMP}/actual-runner-labels.txt"

          if ! comm -23 "${RUNNER_TEMP}/required-runner-labels.txt" "${RUNNER_TEMP}/actual-runner-labels.txt" | grep -q .; then
            echo "Runner label preflight: PASS" 
          else
            echo "Runner label preflight: FAIL" >&2
            comm -23 "${RUNNER_TEMP}/required-runner-labels.txt" "${RUNNER_TEMP}/actual-runner-labels.txt" >&2 || true
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Install JavaScript DOM fixture dependency
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@30.1.0
      - name: Install free local Chromium fixture browser
        run: npx --yes playwright@latest install chromium
      - name: Run free deterministic and browser-fixture acceptance
        env:
          PASI_FREE_TEST_MODE: '1'
        run: python scripts/run_free_acceptance.py

  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: pasi-test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR event uses a synthetic merge checkout. Keep the full graph so
          # base...HEAD has a real merge base for the bounded fast gate.
          fetch-depth: 1
      - name: Fetch fast-validation comparison base
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'beta-foundation') }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$GITHUB_BASE_REF"
          else
            base="main"
          fi
          git fetch --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Install JavaScript DOM fixture dependency
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@30.1.0
      - name: Validate validation sandbox
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: |
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --version
          else
            echo "bubblewrap (bwrap) is required on the self-hosted runner." >&2
            echo "Provision it outside GitHub Actions with the PASI runner capability reconciler." >&2
            exit 1
          fi
      - name: Validate browser acceptance prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            echo "A Chromium-family browser is required on the self-hosted runner." >&2
            echo "Provision it outside GitHub Actions before running CI." >&2
            exit 1
          fi
          if command -v chromedriver >/dev/null 2>&1; then
            chromedriver --version
          elif [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            "$CHROMEWEBDRIVER/chromedriver" --version
          elif [ -x /usr/local/share/chromedriver-linux64/chromedriver ]; then
            /usr/local/share/chromedriver-linux64/chromedriver --version
          else
            echo "ChromeDriver prerequisite not found" >&2
            exit 1
          fi
      - name: Validate unattended launcher shell scripts
        run: |
          bash -n scripts/start_pasi_168h.sh
          python -m pytest -q scripts/test_pasi_168h_launcher.py scripts/test_pasi_168h_supervisor_handoff.py
          bash -n scripts/stop_pasi_overnight.sh
          bash -n scripts/status_pasi_overnight.sh
          bash -n scripts/check_pasi_weekly_run.sh
          bash -n scripts/run_m0_live_acceptance.sh
          bash -n scripts/run_m2_live_acceptance.sh
          python -m py_compile scripts/run_m1_live_acceptance.py
          python -m py_compile scripts/pasi_desktop_preflight.py
      - name: Test desktop preflight envelope handling
        run: python -m pytest -q scripts/test_pasi_desktop_preflight.py
      - name: Validate extended runtime imports
        run: python -c 'import scripts.pasi_extended_runtime_entrypoint, scripts.pasi_weeklong_resilience; print("extended runtime import contract OK")'
      - name: Run changed-file fast validation
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'beta-foundation') }}
        env:
          PASI_FAST_GATE_BASE: origin/${{ github.base_ref || 'main' }}
        run: python scripts/pasi_fast_validation.py --base-ref "$PASI_FAST_GATE_BASE"
      - name: Run canonical validation suite
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: bash scripts/check_all.sh
      - name: Run targeted computer-use regression suites
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: |
          python -m pytest -q automation/orchestrator/test_bridge.py automation/computer_use/test_chatgpt.py scripts/test_pasi_chat.py
          node --test automation/chromium/pasi-chatgpt/test_extension.js automation/chromium/pasi-chatgpt/test_recovery.js automation/chromium/pasi-chatgpt/test_native_mutation.js automation/chromium/pasi-chatgpt/test_dom_fixtures.js
      - name: Run runtime telemetry contract tests
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: python -m pytest -q scripts/test_pasi_runtime_telemetry.py
      - name: Run minimized Chromium response-recovery acceptance test
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: python scripts/e2e_chromium_response_recovery.py
      - name: Run Chromium prompt-submission and chaining acceptance test
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: python scripts/e2e_chromium_prompt_submission.py
      - name: Run Tampermonkey controller contract tests
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: node --test automation/legacy/tampermonkey/chatgpt-controller.test.js
      - name: Run Tampermonkey controller loader contract tests
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: node --test automation/legacy/tampermonkey/chatgpt-controller-loader.test.js
      - name: Validate Tampermonkey controller syntax
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: node --check automation/legacy/tampermonkey/chatgpt-controller.user.js
      - name: Validate Tampermonkey controller loader syntax
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
        run: node --check automation/legacy/tampermonkey/chatgpt-controller-loader.user.js
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: .runtime/ci
          if-no-files-found: ignore

  browser-use-compat:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'beta-foundation' }}
    concurrency:
      group: pasi-browser-use-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: [self-hosted, linux, x64, pasi-wsl]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned browser-use dependency
        run: |
          python -m pip install -r requirements-browser.txt
          python -m pip install 'pytest==8.4.2'
      - name: Validate browser-use version and public imports
        run: |
          python - <<'PY'
          import importlib.metadata
          from browser_use import Agent, Browser

          version = importlib.metadata.version("browser-use")
          assert version == "0.13.10", version
          assert Agent is not None
          assert Browser is not None
          print(f"browser-use {version}: import compatibility OK")
          PY
      - name: Run browser integration contract tests
        run: python -m pytest -q automation/computer_use/test_browser_use.py
