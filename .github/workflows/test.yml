name: test

on:
  push:
    branches: [main, beta-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Repository LOC audit
        run: |
          python - <<'PY'
          import ast, io, json, re, subprocess, tokenize
          from collections import Counter, defaultdict
          from pathlib import Path

          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')[:-1]
          text_exts={'.py','.js','.mjs','.cjs','.ts','.tsx','.jsx','.css','.html','.md','.mdx','.json','.jsonc','.yaml','.yml','.toml','.ini','.cfg','.txt','.sh','.bash','.ps1','.xml','.svg'}
          def text_file(f):
              p=Path(f)
              if p.name in {'.gitignore','.gitattributes','.editorconfig'} or p.suffix.lower() in text_exts: return True
              try:
                  b=p.read_bytes(); return b'\x00' not in b and b.decode('utf-8') is not None
              except Exception: return False
          def py(text):
              lines=text.splitlines(); blank=sum(not x.strip() for x in lines); comments=set()
              try:
                  for t in tokenize.generate_tokens(io.StringIO(text).readline):
                      if t.type==tokenize.COMMENT and lines[t.start[0]-1].strip().startswith('#'): comments.add(t.start[0])
              except Exception: pass
              funcs=classes=0
              try:
                  for n in ast.walk(ast.parse(text)):
                      funcs += isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)); classes += isinstance(n,ast.ClassDef)
              except Exception: pass
              return len(lines),blank,len(comments),len(lines)-blank-len(comments),funcs,classes
          def generic(text,suf):
              lines=text.splitlines(); blank=sum(not x.strip() for x in lines); comments=0; block=False
              for line in lines:
                  s=line.strip()
                  if not s: continue
                  if suf in {'.js','.mjs','.cjs','.ts','.tsx','.jsx','.css'}:
                      if block:
                          comments+=1
                          if '*/' in s: block=False
                      elif s.startswith('//'): comments+=1
                      elif s.startswith('/*'):
                          comments+=1
                          block='*/' not in s[2:]
                  elif suf=='.html':
                      if block:
                          comments+=1
                          if '-->' in s: block=False
                      elif s.startswith('<!--'):
                          comments+=1
                          block='-->' not in s[4:]
                  elif suf in {'.sh','.bash','.ps1','.yaml','.yml','.toml','.ini','.cfg'} and s.startswith(('#',';')): comments+=1
              funcs=classes=0
              if suf in {'.js','.mjs','.cjs','.ts','.tsx','.jsx'}:
                  funcs=sum(bool(re.search(r'\bfunction\b|=>\s*\{?',l)) for l in lines)
                  classes=sum(bool(re.match(r'\s*class\s+',l)) for l in lines)
              return len(lines),blank,comments,len(lines)-blank-comments,funcs,classes

          rows=[]; total=Counter(); cats=defaultdict(Counter); dirs=defaultdict(Counter)
          for f in files:
              if not text_file(f): continue
              text=Path(f).read_text(encoding='utf-8',errors='replace'); suf=Path(f).suffix.lower()
              m=py(text) if suf=='.py' else generic(text,suf)
              lines,blank,comments,code,funcs,classes=m; low=f.lower()
              if '/test_' in low or low.startswith('test_') or low.endswith('_test.py') or low.startswith('tests/') or '/tests/' in low: cat='tests'
              elif low.startswith('docs/') or suf in {'.md','.mdx'} or Path(f).name in {'README.md','SECURITY.md'}: cat='docs'
              elif low.startswith('.github/') or low.startswith('.vscode/') or Path(f).name in {'.gitignore','.gitattributes','.editorconfig','requirements.txt','pyrightconfig.json'} or suf in {'.json','.jsonc','.yaml','.yml','.toml','.ini','.cfg'}: cat='config'
              elif low.startswith('scripts/'): cat='scripts'
              else: cat='production'
              r={'file':f,'lines':lines,'blank':blank,'comments':comments,'code':code,'functions':funcs,'classes':classes,'category':cat}; rows.append(r)
              for k,v in r.items():
                  if k in {'lines','blank','comments','code','functions','classes'}: total[k]+=v; cats[cat][k]+=v; dirs[Path(f).parts[0] if len(Path(f).parts)>1 else '(root)'][k]+=v
              cats[cat]['files']+=1; dirs[Path(f).parts[0] if len(Path(f).parts)>1 else '(root)']['files']+=1
              total['files']+=1
          print('=== EXACT TRACKED-TEXT LOC AUDIT ===')
          print(json.dumps({'totals':dict(total),'categories':{k:dict(v) for k,v in cats.items()},'directories':{k:dict(v) for k,v in dirs.items()},'largest_files':sorted(rows,key=lambda r:r['lines'],reverse=True)[:20],'file_count':len(rows)},indent=2))
          print('=== END AUDIT ===')
          PY
      - name: Run beta smoke test
        env:
          PYTHONPATH: src
        run: python scripts/smoke_test_beta.py
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Static type check
        run: npx --yes pyright@latest src scripts
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@latest "**/*.md" "#node_modules" "#**/.venv/**" "#**/venv/**" "#**/env/**"
      - name: Validate web client syntax
        run: |
          set -e
          for file in web/*.js; do node --check "$file"; done
      - name: Frontend contract smoke test
        env:
          PYTHONPATH: src
        run: python scripts/frontend_contract_test.py
      - name: Browser/API smoke test
        env:
          PYTHONPATH: src
        run: |
          set -e
          mkdir -p .runtime/ci
          python scripts/serve_web.py > .runtime/ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:8000/ | grep -q 'chat-form'
          curl -fsS http://127.0.0.1:8000/ | grep -q 'production-ui.js'
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/manifest | grep -q 'Engineering'
          python scripts/e2e_api_smoke.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: .runtime/ci
          if-no-files-found: ignore
