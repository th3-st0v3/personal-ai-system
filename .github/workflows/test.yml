name: test

on:
  # Repository branch pushes are the authoritative fast validation trigger.
  # This prevents untrusted fork pull requests from executing on the private PASI runner.
  push:
    branches: [main, beta-foundation, 'pasi/**']
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation mode"
        required: true
        type: choice
        options:
          - fast
          - live
        default: fast

concurrency:
  group: pasi-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # M0 P0.1 intentionally reserves the shared self-hosted machine for the
    # authenticated live acceptance seam; generic test validation is skipped
    # on M0 pushes and remains available through normal pushes/dispatch.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '(m0)')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-browser.txt
          npm install --no-save --package-lock=false --ignore-scripts jsdom@30.1.0

      - name: Validate browser-use contract
        run: |
          python - <<'PY'
          import importlib.metadata
          from browser_use import Agent, Browser

          version = importlib.metadata.version("browser-use")
          assert version == "0.13.10", version
          assert Agent is not None
          assert Browser is not None
          print(f"browser-use {version}: import compatibility OK")
          PY

      - name: Run fast fixture and contract validation
        run: bash scripts/check_fast.sh

      - name: Validate live Chromium prerequisites
        if: ${{ inputs.mode == 'live' }}
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            echo "A Linux Chromium/Chrome binary is required for live mode; fast mode uses fixtures and does not install a browser." >&2
            exit 1
          fi

          if command -v chromedriver >/dev/null 2>&1; then
            chromedriver --version
          elif [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            "$CHROMEWEBDRIVER/chromedriver" --version
          elif [ -x /usr/local/share/chromedriver-linux64/chromedriver ]; then
            /usr/local/share/chromedriver-linux64/chromedriver --version
          else
            echo "ChromeDriver prerequisite not found for live mode" >&2
            exit 1
          fi

      - name: Run live Chromium response-recovery acceptance
        if: ${{ inputs.mode == 'live' }}
        run: python scripts/e2e_chromium_response_recovery.py

      - name: Run live Chromium prompt-submission acceptance
        if: ${{ inputs.mode == 'live' }}
        run: python scripts/e2e_chromium_prompt_submission.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: .runtime/ci
          if-no-files-found: ignore
