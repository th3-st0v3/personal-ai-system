name: test

on:
  # Hosted GitHub Actions is the authoritative repository validation path.
  # PRs and protected branch pushes use the same non-privileged hosted checks.
  pull_request:
  push:
    branches: [main, beta-foundation, 'pasi/**']
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation mode"
        required: true
        type: choice
        options:
          - fast
        default: fast

concurrency:
  group: pasi-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # All repository validation runs on GitHub-hosted runners. Authenticated
    # desktop M0 evidence is a local runtime acceptance, not a CI dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-browser.txt

      - name: Validate browser-use contract
        run: |
          python - <<'PY'
          import importlib.metadata
          from browser_use import Agent, Browser

          version = importlib.metadata.version("browser-use")
          assert version == "0.13.10", version
          assert Agent is not None
          assert Browser is not None
          print(f"browser-use {version}: import compatibility OK")
          PY

      - name: Run fast fixture and contract validation
        run: bash scripts/check_fast.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: .runtime/ci
          if-no-files-found: ignore
