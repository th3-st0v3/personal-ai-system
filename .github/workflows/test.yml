name: test

on:
  push:
    branches: [main, beta-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run beta smoke test
        env:
          PYTHONPATH: src
        run: python scripts/smoke_test_beta.py
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Static type check
        run: npx --yes pyright@latest src scripts
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@latest "**/*.md" "#node_modules"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate web client syntax
        run: node --check web/app.js && node --check web/interaction-fixes.js && node --check web/beta-features.js && node --check web/ui-stability.js && node --check web/product-polish.js && node --check web/ux-hardening.js
