name: test

on:
  push:
    branches: [main, beta-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run beta smoke test
        env:
          PYTHONPATH: src
        run: python scripts/smoke_test_beta.py
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Static type check
        run: npx --yes pyright@latest src scripts
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@latest "**/*.md" "#node_modules"
      - name: Validate web client syntax
        run: |
          set -e
          node --check web/app.js
          node --check web/interaction-fixes.js
          node --check web/beta-features.js
          node --check web/ui-stability.js
          node --check web/product-polish.js
          node --check web/ux-hardening.js
          node --check web/ux-final.js
          node --check web/ux-shortcuts.js
          node --check web/engineering-final.js
      - name: Browser/API smoke test
        env:
          PYTHONPATH: src
        run: |
          set -e
          mkdir -p .runtime/ci
          python scripts/serve_web.py > .runtime/ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:8000/ | grep -q 'chat-form'
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/manifest | grep -q 'Engineering'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: .runtime/ci
          if-no-files-found: ignore
