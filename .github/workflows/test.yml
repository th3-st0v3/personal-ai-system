name: test

on:
  push:
    branches: [main, beta-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate web client syntax
        run: node --check web/app.js
