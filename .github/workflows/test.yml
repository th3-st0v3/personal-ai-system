name: test

on:
  push:
    branches: [main, beta-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PASI_REQUIRE_BWRAP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Enable unprivileged namespaces for sandbox validation
        run: |
          if sudo sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Install Bubblewrap sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      - name: Run canonical validation suite
        run: bash scripts/check_all.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: .runtime/ci
          if-no-files-found: ignore

  browser-use-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned browser-use dependency
        run: |
          python -m pip install -r requirements-browser.txt
          python -m pip install 'pytest==8.4.2'
      - name: Validate browser-use version and public imports
        run: |
          python - <<'PY'
          import importlib.metadata
          from browser_use import Agent, Browser

          version = importlib.metadata.version("browser-use")
          assert version == "0.13.10", version
          assert Agent is not None
          assert Browser is not None
          print(f"browser-use {version}: import compatibility OK")
          PY
      - name: Run browser integration contract tests
        run: python -m pytest -q automation/computer_use/test_browser_use.py
