name: pasi-runner-capabilities

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to reconcile"
        required: false
        default: "main"
      apply:
        description: "Install allowlisted missing system/Python dependencies"
        required: true
        type: boolean
        default: true
      apply_optional:
        description: "Also reconcile optional tools such as the configured Ollama model"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pasi-runner-capabilities
  cancel-in-progress: false

jobs:
  detect-health:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: [self-hosted, linux, x64, pasi-desktop]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Detect runner capabilities
        run: |
          mkdir -p "$RUNNER_TEMP/pasi-capabilities"
          python3 scripts/reconcile_runner_capabilities.py \
            --spec config/runner/capabilities.json \
            --report "$RUNNER_TEMP/pasi-capabilities/capabilities.json" \
            --json

      - name: Verify detect-only result
        run: |
          python3 -c 'import json, pathlib; p=pathlib.Path("$RUNNER_TEMP/pasi-capabilities/capabilities.json"); report=json.loads(p.read_text()); assert report.get("required_ok") is True, "runner capability health check failed"; print("Runner capability detect-only health check: PASS")'

      - name: Upload health evidence
        uses: actions/upload-artifact@v6
        with:
          name: pasi-runner-health-detect
          path: ${{ runner.temp }}/pasi-capabilities/capabilities.json
          if-no-files-found: error

  reconcile:
    runs-on: [self-hosted, linux, x64, pasi-desktop]
    timeout-minutes: 45
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: printf 'ref=%s\n' "${REQUESTED_REF:-main}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 1

      - name: Reconcile runner capabilities
        env:
          APPLY: ${{ inputs.apply }}
          APPLY_OPTIONAL: ${{ inputs.apply_optional }}
        run: |
          args=(--spec config/runner/capabilities.json --report "$HOME/.pasi/runner/capabilities.json" --json)
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          if [[ "$APPLY_OPTIONAL" == "true" ]]; then args+=(--apply-optional); fi
          python3 scripts/reconcile_runner_capabilities.py "${args[@]}"

      - name: Verify runner resource boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads((Path.home() / ".pasi" / "runner" / "capabilities.json").read_text())
          if report.get("required_ok") is not True:
              raise SystemExit("runner capability contract is not satisfied")
          print("Runner capability contract: PASS")
          PY

      - name: Stage capability evidence
        run: |
          mkdir -p "$RUNNER_TEMP/pasi-capabilities"
          cp "$HOME/.pasi/runner/capabilities.json" "$RUNNER_TEMP/pasi-capabilities/capabilities.json"

      - name: Upload capability evidence
        uses: actions/upload-artifact@v6
        with:
          name: pasi-runner-capabilities
          path: ${{ runner.temp }}/pasi-capabilities/capabilities.json
          if-no-files-found: error
