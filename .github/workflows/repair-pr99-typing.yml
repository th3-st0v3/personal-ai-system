name: repair-pr99-typing

on:
  push:
    branches:
      - codex/overnight-resilience-native-browser

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: repair PR99 typing') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/overnight-resilience-native-browser
          fetch-depth: 0
      - name: Apply deterministic typing repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          supervisor = Path('scripts/pasi_overnight_engine_v2.py')
          text = supervisor.read_text(encoding='utf-8')
          text = text.replace('from typing import Any, Sequence', 'from typing import Any, Mapping, Sequence')
          text = text.replace('def automation_gate_is_satisfied(evidence: dict[str, object]) -> bool:', 'def automation_gate_is_satisfied(evidence: Mapping[str, object]) -> bool:')
          supervisor.write_text(text, encoding='utf-8')

          stub = Path('scripts/pasi_overnight_engine_v2.pyi')
          stub_text = stub.read_text(encoding='utf-8')
          if 'RUNTIME_DIR: Path' not in stub_text:
              stub_text = stub_text.replace('MAX_ATTEMPTS: int\n', 'MAX_ATTEMPTS: int\nRUNTIME_DIR: Path\nSTATE_PATH: Path\n')
          stub.write_text(stub_text, encoding='utf-8')
          PY
          rm .github/workflows/repair-pr99-typing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pasi_overnight_engine_v2.py scripts/pasi_overnight_engine_v2.pyi .github/workflows/repair-pr99-typing.yml
          git commit -m 'fix: repair PR99 typing' --no-verify
          git push origin codex/overnight-resilience-native-browser
