name: pasi-development

on:
  pull_request:
  push:
    branches: ['pasi/**']
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to test/start"
        required: false
        default: ""
      mode:
        description: "Development action"
        required: true
        type: choice
        options:
          - verify
          - start-automation
          - status
          - stop
        default: verify
      roadmap:
        description: "Repository-relative roadmap path"
        required: false
        default: "roadmaps/pasi-default.json"

permissions:
  contents: read

jobs:
  verify:
    concurrency:
      group: ${{ format('{0}-{1}-verify', github.workflow, github.ref) }}
      cancel-in-progress: false
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.mode == 'verify' || inputs.mode == 'start-automation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve requested ref
        id: ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
        run: |
          ref="${REQUESTED_REF:-${GITHUB_REF_NAME}}"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate roadmap
        env:
          ROADMAP: ${{ inputs.roadmap || 'roadmaps/pasi-default.json' }}
        run: |
          python - "$ROADMAP" <<'PY'
          import sys
          from pathlib import Path
          from scripts.pasi_hybrid_planner import PlannerError, load_roadmap

          root = Path.cwd().resolve()
          candidate = (root / sys.argv[1]).resolve()
          if root not in candidate.parents:
              raise SystemExit("roadmap must remain inside the checked-out repository")
          if not candidate.is_file():
              raise SystemExit(f"roadmap not found: {candidate}")
          try:
              tasks = load_roadmap(candidate)
          except PlannerError as exc:
              raise SystemExit(f"invalid roadmap: {exc}") from exc
          print(f"Roadmap valid: {candidate} ({len(tasks)} tasks)")
          PY

      - name: Run hybrid planner tests
        run: python -m pytest -q scripts/test_pasi_hybrid_planner.py

      - name: Run DOM-free browser bridge contract tests
        run: |
          node --test automation/chromium/pasi-chatgpt/test_extension.js

      - name: Run canonical validation
        run: bash scripts/check_all.sh

