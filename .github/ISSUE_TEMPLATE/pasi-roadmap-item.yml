name: PASI Roadmap Item
description: Create a roadmap issue with fields that synchronize directly into the PASI Project.
title: "[Roadmap] "
labels:
  - roadmap
assignees:
  - th3-st0v3
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the capability or deliverable. This becomes the PASI Project Description field.
      placeholder: Explain what this roadmap item should accomplish.
    validations:
      required: true

  - type: input
    id: start_date
    attributes:
      label: Start Date
      description: Project start date in YYYY-MM-DD format.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: input
    id: end_date
    attributes:
      label: End Date
      description: Project target/end date in YYYY-MM-DD format.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: input
    id: relationship
    attributes:
      label: Relationship
      description: Record dependencies or links, such as "depends on #273", "blocks #280", or "related to #319". Use "None" when standalone.
      placeholder: depends on #273
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Existing GitHub issue milestone title. The synchronizer assigns the issue's native Milestone setting.
      placeholder: M0
    validations:
      required: true

  - type: input
    id: development
    attributes:
      label: Development
      description: Native GitHub Development action. Use "create branch: <branch-name>" to create and link a branch, or "link <existing-branch>" to record a manual-link request.
      placeholder: create branch: pasi/feature-example
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: This maps to the PASI Project Status field.
      options:
        - Todo
        - In Progress
        - Done
      default: 0
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        The PASI Project automation will add this roadmap issue to the Project, set native Start date/Target date/Quarter/Iteration scheduling, apply native Relationships and Milestone, handle Development branch creation when requested, and synchronize Status.