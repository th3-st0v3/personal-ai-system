name: PASI Roadmap Item
description: Create a roadmap issue with scheduling fields that synchronize directly into the PASI Project.
title: "[Roadmap] "
labels:
  - roadmap
assignees:
  - th3-st0v3
body:
  - type: input
    id: start_date
    attributes:
      label: Start Date
      description: Project start date in YYYY-MM-DD format.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: input
    id: end_date
    attributes:
      label: End Date
      description: Project target/end date in YYYY-MM-DD format.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: This maps to the PASI Project Status field.
      options:
        - Todo
        - In Progress
        - Done
      default: 0
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        GitHub's native issue controls are used for the remaining metadata:
        Milestone, Relationships, and Development are configured directly on the issue when needed.
        The PASI synchronizer does not create or read text-form choices for those native settings.
